name: Deploy Laravel Project on push to cpanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🛎 Checkout code
        uses: actions/checkout@v3

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ./domains/todolist.rapipaja.my.id/public_html/
          timeout: 60000
          dangerous-clean-slate: false
          # Exclude folder/file yang tidak perlu di-upload ulang
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/bootstrap/cache/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/stubs/**
            **/tests/**
            **/.env
            **/.env.*
            **/package-lock.json
            **/yarn.lock
            **/vite.config.js
            **/phpunit.xml
            **/README.md
            **/AGENTS.md
            **/CLAUDE.md
            **/vendor.zip
