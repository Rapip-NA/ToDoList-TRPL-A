name: Deploy Laravel Project on push to cpanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🛎 Checkout code
        uses: actions/checkout@v3

      - name: 📂 Copy files via SFTP / SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          target: domains/todolist.rapipaja.my.id/public_html/
          source: >-
            app/,
            bootstrap/app.php,
            bootstrap/providers.php,
            config/,
            database/migrations/,
            database/seeders/,
            database/factories/,
            public/,
            resources/,
            routes/,
            artisan,
            composer.json,
            composer.lock,
            package.json
          strip_components: 0
          overwrite: true
